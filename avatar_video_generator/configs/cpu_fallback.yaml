# avatar_video_generator — CPU-only / low-VRAM fallback configuration
# Disables diffusion (requires GPU). Uses ControlNet SD1.5 with CPU offload.
# Very slow — intended for testing pipeline correctness without a GPU.

device: "cpu"
output_dir: "outputs/avatar_photorealistic"
cache_dir: "outputs/avatar_photorealistic/.cache"
verbose: true

identity:
  backend: "none"               # InsightFace requires ONNX runtime (slow on CPU)
  multi_frame_average: false
  multi_frame_count: 1

diffusion:
  use_sdxl: false
  use_animatediff: false        # AnimateDiff requires GPU
  base_model_sd15: "runwayml/stable-diffusion-v1-5"
  controlnet_model_sd15: "lllyasviel/control_v11p_sd15_openpose"
  resolution: 512
  num_inference_steps: 10       # fewer steps for speed
  guidance_scale: 7.0
  controlnet_conditioning_scale: 1.0
  seed: 42
  enable_xformers: false
  enable_cpu_offload: true
  use_fp16: false               # float32 on CPU

temporal:
  pixel_smooth_sigma: 1.0
  use_flow_warp: false

interpolation:
  enabled: false                # RIFE requires GPU for reasonable speed

export:
  fps: 25.0
  codec: "libx264"
  crf: 23
  pixel_format: "yuv420p"
  export_comparison: false
